version: '3.8'

services:
  # Servicio de Backend (API Node.js / Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartfood-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - smartfood-network
    restart: unless-stopped

  # Servicio de Frontend (Servidor Web Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartfood-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - smartfood-network
    restart: unless-stopped

networks:
  smartfood-network:
    driver: bridge
